<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>

    <style>


        .product{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;

            height: 400px;
            background-color: aqua;
            flex-direction: column;
        }



        .box{
            border: 1px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            background-color: antiquewhite;
            font-family: cursive;
            font-weight: bolder;
        }



    </style>
</head>
<body>
    <!--Flex Gives Display in 1 Dimensional - either in Row or Coloumn
    By Default - Row Wise Display : Side By Side 
    -->

    <div class="product">

        <div class="box">Cake</div>
        <div class="box">Cookie</div>
        <div class="box">Pastry</div>
    </div>    
</body>
</html>
